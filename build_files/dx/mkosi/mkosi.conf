# Alternative DX sysext builder (DX_BUILDER=mkosi). Run through build-sysext-mkosi.sh, which
# passes --base-tree (the finished image's rootfs) and --release (the image's VERSION_ID) and
# generates mkosi.conf.d/10-packages.conf from ../packages.txt.
[Distribution]
Distribution=fedora
# Overridden by --release=<VERSION_ID of the image>.
Release=44

[Output]
Format=sysext
Output=wrasse-dx
# systemd-sysext cannot attach a compressed image; mkosi would otherwise zstd the .raw.
CompressOutput=no
ManifestFormat=json

[Content]
# Only what is not already in the base tree lands in the sysext.
Overlay=yes
Bootable=no
Bootloader=none
# The base tree is a bootc image: keep its rpm database and dnf metadata so dnf sees what is installed.
CleanPackageMetadata=no
# Wrasse's own files (sysctl, modules-load, tmpfiles, units, VS Code hook), shared with the script builder.
ExtraTrees=../files:/

[Build]
# Run mkosi's tools from a Fedora tools tree so the runner's distro does not matter (the runner is Ubuntu).
ToolsTree=default
ToolsTreeDistribution=fedora
