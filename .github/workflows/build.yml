name: Build Images
# One workflow, one branch (main). Every release line x GPU flavor is an independent
# matrix cell that publishes its own tag; a failing cell never blocks the others.
#
# Lines and flavors come from .github/build-matrix.json (set a line's "nvidia" to
# false to drop its nvidia image). Fedora versions are resolved per run by
# .github/scripts/resolve-lines.sh. Secrets needed for signing: docs/CI-SECRETS.md.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
      - "system_files/shared/etc/bazaar/**"
      - "flatpaks/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
      - "system_files/shared/etc/bazaar/**"
      - "flatpaks/**"
  merge_group:
  schedule:
    - cron: "0 1 * * TUE" # Every Tuesday at 1:00 AM UTC
  workflow_dispatch:
    inputs:
      only_line:
        description: "Build a single release line (default: all)"
        type: choice
        default: all
        options:
          - all
          - reimagined
          - next
          - stable

env:
  IMAGE_BASE: wrasse
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  plan:
    name: Resolve release lines
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve Fedora versions and build matrix
        id: matrix
        env:
          ONLY_LINE: ${{ inputs.only_line }}
        run: |
          set -euo pipefail
          .github/scripts/resolve-lines.sh versions >&2
          matrix="$(.github/scripts/resolve-lines.sh matrix)"
          if [[ -n "${ONLY_LINE:-}" && "${ONLY_LINE}" != "all" ]]; then
            matrix="$(jq -c --arg l "${ONLY_LINE}" '.include |= map(select(.line == $l))' <<<"${matrix}")"
          fi
          if [[ "$(jq '.include | length' <<<"${matrix}")" -eq 0 ]]; then
            echo "::error::Build matrix is empty"
            exit 1
          fi
          echo "Matrix:"
          jq -r '.include[] | " - \(.line)/\(.flavor): Fedora \(.fedora_version) (prerelease=\(.prerelease))"' <<<"${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.line }} ${{ matrix.flavor }} (F${{ matrix.fedora_version }})
    needs: [plan]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      # Cells are independent: one failing never cancels or blocks another.
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # Consumed by the Justfile; the Fedora version for this line was resolved once in `plan`.
      FEDORA_VERSION: ${{ matrix.fedora_version }}
      FEDORA_PRERELEASE: ${{ matrix.prerelease }}
      LINE: ${{ matrix.line }}
      FLAVOR: ${{ matrix.flavor }}
      KERNEL_PIN: ${{ matrix.kernel_pin }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Install Just
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install just
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        shell: bash
        run: |
          IMAGE_NAME="$(just image_name "${IMAGE_BASE}" "${LINE}" "${FLAVOR}")"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        shell: bash
        run: |
          DEFAULT_TAG="$(just generate-default-tag "${LINE}" "1")"
          echo "Default Tag: ${DEFAULT_TAG}"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: DNF Package Cache Setup
        shell: bash
        id: setup-cache
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          CACHE="$(just setup-cache "${IMAGE_BASE}" \
                            "${LINE}" \
                            "1" \
                            "${GITHUB_EVENT_NAME}")"

          CACHE_NAME="$(echo "${CACHE}" | cut -d' ' -f 1)"
          ALLOW_CACHE_WRITE="$(echo "${CACHE}" | cut -d' ' -f 2)"

          echo "cache_name=${CACHE_NAME}" >> "$GITHUB_OUTPUT"
          echo "allow_cache_write=${ALLOW_CACHE_WRITE}" >> "$GITHUB_OUTPUT"

      - name: Restore DNF package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NAME: ${{ steps.setup-cache.outputs.cache_name }}
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}

      # Fails closed: `just build` exits non-zero when the base or akmods image for this
      # Fedora version/kernel is missing or cosign verification fails. Every later step
      # (including every push) is skipped, so this cell's tag keeps the last good image.
      - name: Build Image
        id: build-image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo -E $(command -v just) repo_organization="${{ github.repository_owner }}" \
                    build-ghcr "${IMAGE_BASE}" \
                               "${LINE}" \
                               "${FLAVOR}" \
                               "${KERNEL_PIN}"

      # Size of the DX sysext baked into the image (Phase 3 asks for this number; it cannot
      # be known without a build). Reported only, never fails the cell.
      - name: Report DX sysext size
        shell: bash
        run: |
          set -euo pipefail
          dir=/usr/share/wrasse/sysexts
          size="$(sudo podman run --rm --entrypoint stat "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" -c '%s' "${dir}/wrasse-dx.raw")"
          release="$(sudo podman run --rm --entrypoint cat "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" "${dir}/wrasse-dx.extension-release")"
          {
            echo "### DX sysext: ${LINE} ${FLAVOR}"
            echo ""
            echo "- wrasse-dx.raw: $(numfmt --to=iec --suffix=B "${size}") (${size} bytes)"
            echo '- extension-release:'
            echo '```'
            echo "${release}"
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # https://github.com/actions/cache/issues/1533
      - name: Hack around permission issue caching
        shell: bash
        id: cache-perms
        run: |
          sudo chmod 777 --recursive /var/tmp/buildah-cache-0

      - name: Write new DNF package cache
        if: steps.setup-cache.outputs.allow_cache_write == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_NAME: ${{ steps.setup-cache.outputs.cache_name }}
        with:
          path: /var/tmp/buildah-cache-*
          key: ${{ runner.os }}-${{ runner.arch }}-buildah-${{ env.CACHE_NAME }}

      - name: Setup Syft
        id: setup-syft
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.39.0

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        id: generate-sbom
        env:
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          sudo -E $(command -v just) gen-sbom "${IMAGE_BASE}" \
                            "${LINE}" \
                            "${FLAVOR}" \
                            "${SYFT_CMD}"

      - name: Rechunk Image
        id: rechunk-image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo -E $(command -v just) repo_organization="${{ github.repository_owner }}" \
                            rechunk "${IMAGE_BASE}" \
                            "${LINE}" \
                            "${FLAVOR}" \
                            "1"

      - name: Load Image into Podman
        id: load-rechunk
        shell: bash
        run: |
          sudo -E $(command -v just) load-rechunk "${IMAGE_BASE}" \
                            "${LINE}" \
                            "${FLAVOR}"

      - name: Secureboot Check
        id: secureboot
        shell: bash
        run: |
          sudo -E $(command -v just) secureboot "${IMAGE_BASE}" \
                          "${LINE}" \
                          "${FLAVOR}"

      - name: Generate tags
        id: generate-tags
        shell: bash
        run: |
          alias_tags="$(just generate-build-tags \
                     "${IMAGE_BASE}" \
                     "${LINE}" \
                     "${FLAVOR}" \
                     "${KERNEL_PIN}" \
                     "1" \
                     "$(podman inspect ${IMAGE_NAME}:${DEFAULT_TAG} | jq -r '.[].Config.Labels["org.opencontainers.image.version"]')" \
                     "${{ github.event_name }}" \
                     "${{ github.event.number }}")"

          echo "Tags for this Action..."
          echo "$alias_tags"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      # Tag Images
      - name: Tag Images
        shell: bash
        run: |
          set -eoux pipefail
          sudo -E $(command -v just) tag-images "${IMAGE_NAME}" \
                          "${DEFAULT_TAG}" \
                          "${{ steps.generate-tags.outputs.alias_tags }}"

      # Workaround bug where capital letters in your GitHub username make it impossible to push to GHCR.
      # https://github.com/macbre/push-to-ghcr/issues/12
      - name: Lowercase Registry
        id: registry_case
        uses: ASzc/change-string-case-action@ecd1412d078f2e06e9eedcbaa6fcd988151c3f82 # v8
        with:
          string: ${{ env.IMAGE_REGISTRY }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | podman login ghcr.io -u ${{ github.actor }} --password-stdin
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 15
          timeout_minutes: 30
          command: |
            set -euox pipefail

            digest_file="$PWD/.push-digest"
            for tag in ${{ steps.generate-tags.outputs.alias_tags }}; do
              dest=${{ steps.registry_case.outputs.lowercase }}/${{ env.IMAGE_NAME }}:${tag}
              sudo -E podman push --digestfile "${digest_file}" ${{ env.IMAGE_NAME }}:${tag} "${dest}"
              # We need to push twice to workaround https://github.com/containers/podman/issues/27796
              # If we don't do this then the digest changes and we are only signing this specific tag
              sudo -E podman push --digestfile "${digest_file}" ${{ env.IMAGE_NAME }}:${tag} "${dest}"
            done

            digest="$(cat "${digest_file}")"
            echo "digest=${digest}" >> $GITHUB_OUTPUT

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: github.event_name != 'pull_request'

      - name: Sign container image
        if: github.event_name != 'pull_request'
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${{ steps.registry_case.outputs.lowercase }}/${{ env.IMAGE_NAME }}@${TAGS}
        env:
          TAGS: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Install ORAS
        if: github.event_name != 'pull_request'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Login to GitHub Container Registry with ORAS
        if: github.event_name != 'pull_request'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Upload SBOM
        if: github.event_name != 'pull_request'
        id: upload-sbom
        env:
          IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          SBOM="sbom_out/${IMAGE_NAME}/sbom.json"

          cd "$(dirname "${SBOM}")"
          oras attach \
            --artifact-type application/vnd.spdx+json \
            --annotation filename=$(basename "$SBOM") \
            "${IMAGE}@${DIGEST}" \
            "$(basename ${SBOM})"

          sbom_digest=$(oras discover --format json "${IMAGE}@${DIGEST}" | jq -r '.referrers[] | select(.artifactType == "application/vnd.spdx+json") | .digest')

          echo "sbom_digest=${sbom_digest}" >> $GITHUB_OUTPUT

      - name: Sign SBOM OCI Artifact
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          LOWERCASE: ${{ steps.registry_case.outputs.lowercase }}
          SBOM_DIGEST: ${{ steps.upload-sbom.outputs.sbom_digest }}
        run: |
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${LOWERCASE}/${IMAGE_NAME}@${SBOM_DIGEST}

      - name: Attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  check:
    name: Summary
    if: always()
    runs-on: ubuntu-latest
    needs: [plan, build]
    steps:
      - name: Report cells
        env:
          JOBS: ${{ toJson(needs) }}
        run: |
          echo "Job status:"
          echo "$JOBS" | jq -r 'to_entries[] | " - \(.key): \(.value.result)"'

          # A failed or skipped cell is already fail-closed (nothing was pushed for it), so
          # this job only makes the run red; it never re-runs or cancels the other cells.
          for i in $(echo "$JOBS" | jq -r 'to_entries[] | .value.result'); do
            if [ "$i" != "success" ] && [ "$i" != "skipped" ]; then
              echo ""
              echo "At least one release line failed. Failed cells pushed nothing."
              exit 1
            fi
          done

  generate-release:
    name: Generate Release
    needs: [build]
    # Changelog and GitHub release for the stable line only; skipped on pull requests.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/generate-release.yml
    with:
      stream_name: '["stable"]'
