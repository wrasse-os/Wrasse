# systemd-oomd system-wide defaults for Wrasse, see docs/MEMORY.md and oomd.conf(5).
# Fedora's systemd-oomd-defaults already ships 10-oomd-defaults.conf (20 s); this drop-in sorts after it and pins
# every value so a change in the Fedora package cannot shift behaviour under the zram/MGLRU tuning.
[OOM]
# Only act when memory AND zram swap are both above this: with vm.swappiness=180, swap is used long before memory is short.
SwapUsedLimit=90%
# Memory pressure (share of a 10 s window all tasks were stalled) a ManagedOOMMemoryPressure=kill unit may reach.
# wrasse-agents.slice overrides this to 50% in its own drop-in.
DefaultMemoryPressureLimit=60%
# Must hold this long; above the 1 s MGLRU min_ttl_ms working-set protection, so oomd acts only on sustained thrashing.
DefaultMemoryPressureDurationSec=20s
