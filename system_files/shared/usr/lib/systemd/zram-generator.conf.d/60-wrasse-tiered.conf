# Two-stage zram. lz4 compresses every page on swap-out and keeps swap-in
# fast; zstd is registered as the recompression algorithm (priority 1) for
# pages that have gone cold. zram never recompresses on its own - the kernel
# leaves that to userspace - so wrasse-zram-recompress.timer drives it.
#
# A drop-in rather than the main file: it overrides the stock
# /etc/systemd/zram-generator.conf, and /etc/systemd/zram-generator.conf.d/
# can still override this locally.
[zram0]
compression-algorithm = lz4 zstd(level=3)
