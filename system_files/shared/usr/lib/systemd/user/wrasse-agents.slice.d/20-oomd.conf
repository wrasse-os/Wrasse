# Fedora's systemd-oomd-defaults ships user/slice.d/10-oomd-per-slice-defaults.conf,
# which sets ManagedOOMMemoryPressureLimit=80% on every user slice. A setting in
# wrasse-agents.slice itself loses to it (verified), so the agent-specific values
# live in a drop-in whose name sorts after it.
[Slice]
# Act at 50% pressure (the oomd default is 60%, Fedora's slice default 80%),
# sustained for 20 s (the oomd default is 30 s): the agent is the first thing to go.
ManagedOOMMemoryPressureLimit=50%
ManagedOOMMemoryPressureDurationSec=20s
