# DAMON_RECLAIM: push pages idle for 5+ minutes to zram before memory runs
# short, instead of waiting for kswapd. Bounded to 64 MiB and 10 ms of CPU
# per second, and backs off when memory PSI stall exceeds 1 ms/s.
# Active only while free memory is between 2% and 30%; idle above 40%.
# Parameters go first: writing enabled=Y starts kdamond with them.
w /sys/module/damon_reclaim/parameters/min_age - - - - 300000000
w /sys/module/damon_reclaim/parameters/quota_sz - - - - 67108864
w /sys/module/damon_reclaim/parameters/quota_reset_interval_ms - - - - 1000
w /sys/module/damon_reclaim/parameters/quota_ms - - - - 10
w /sys/module/damon_reclaim/parameters/quota_mem_pressure_us - - - - 1000
w /sys/module/damon_reclaim/parameters/wmarks_high - - - - 400
w /sys/module/damon_reclaim/parameters/wmarks_mid - - - - 300
w /sys/module/damon_reclaim/parameters/wmarks_low - - - - 20
w /sys/module/damon_reclaim/parameters/wmarks_interval - - - - 5000000
w /sys/module/damon_reclaim/parameters/skip_anon - - - - N
w /sys/module/damon_reclaim/parameters/enabled - - - - Y
