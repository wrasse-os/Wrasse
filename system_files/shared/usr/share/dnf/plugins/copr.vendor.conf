# dnf5's copr plugin picks the COPR chroot from ID in /etc/os-release. Wrasse is not a Fedora ID,
# so pin the distribution; otherwise `dnf5 copr enable` looks for a chroot that does not exist.
# Same override as ublue-os/main (sys_files/usr/share/dnf/plugins/copr.vendor.conf).

[main]
distribution = fedora
